#===============================
# CI-only law config overlay
#===============================
# Used only by the GitLab CI "analysis" job, via LAW_CONFIG_FILE set in the .setups/dev.sh
# it pre-seeds (see .gitlab-ci.yml). Inherits everything from the real law.cfg, and only
# overrides [outputs].base_fs so task outputs (GetDatasetLFNs, BundleExternalFiles,
# CalibrateEvents, SelectEvents, etc. - every entry in law.cfg's [outputs] section is just
# an alias back to base_fs) are written to local_fs_ci_store instead of real EOS/grid
# storage, which the CI environment has no credentials for.
#
# Local development and production runs never set LAW_CONFIG_FILE, so they always use
# law.cfg directly and are completely unaffected by this file.

[core]
inherit: $MULTILEPTON_BASE/law.cfg

[outputs]
base_fs: local, local_fs_ci_store
